name: Frontend CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - dev
      - stage
      - main

env:
  IMAGE_NAME: quay.io/roni-tamari/the-intelligent-investor-frontend

jobs:
  test:
    name: Stage 1 - Validate code and run tests
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - name: Stage 1.1 - Checkout frontend code
        uses: actions/checkout@v4

      - name: Stage 1.2 - Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Stage 1.3 - Install dependencies
        run: npm ci

      - name: Stage 1.4 - Run lint
        run: npm run lint

      - name: Stage 1.5 - Run unit tests
        run: npm test

      - name: Stage 1.6 - Build application
        run: npm run build

      - name: Stage 1.7 - Start application for e2e tests
        run: |
          npm run start > next.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://localhost:3000 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat next.log
          exit 1

      - name: Stage 1.8 - Run end-to-end tests
        run: npm run e2e

  docker-build:
    name: Stage 2 - Build Docker image on every push
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Stage 2.1 - Checkout frontend code
        uses: actions/checkout@v4

      - name: Stage 2.2 - Build frontend Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:4000 \
            -t $IMAGE_NAME:${{ github.sha }} \
            .

  build-and-push:
    name: Stage 3 - Build and push deployment image
    needs: test
    if: github.event_name == 'push' && (github.ref_name == 'stage' || github.ref_name == 'main')
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      environment: ${{ steps.vars.outputs.environment }}
      manifest_file: ${{ steps.vars.outputs.manifest_file }}

    steps:
      - name: Stage 3.1 - Checkout frontend code
        uses: actions/checkout@v4

      - name: Stage 3.2 - Set deployment variables
        id: vars
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "image_tag=prod" >> $GITHUB_OUTPUT
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "manifest_file=k8s/prod.yaml" >> $GITHUB_OUTPUT
          elif [ "${GITHUB_REF_NAME}" = "stage" ]; then
            echo "image_tag=prep" >> $GITHUB_OUTPUT
            echo "environment=prep" >> $GITHUB_OUTPUT
            echo "manifest_file=k8s/prep.yaml" >> $GITHUB_OUTPUT
          fi

      - name: Stage 3.3 - Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Stage 3.4 - Build tagged frontend image
        env:
          NEXT_PUBLIC_API_URL_PREP: ${{ secrets.NEXT_PUBLIC_API_URL_PREP }}
          NEXT_PUBLIC_API_URL_PROD: ${{ secrets.NEXT_PUBLIC_API_URL_PROD }}
        run: |
          if [ "${{ steps.vars.outputs.environment }}" = "prod" ]; then
            API_URL="$NEXT_PUBLIC_API_URL_PROD"
          else
            API_URL="$NEXT_PUBLIC_API_URL_PREP"
          fi

          if [ -z "$API_URL" ]; then
            echo "Missing frontend API URL secret for ${{ steps.vars.outputs.environment }} environment"
            exit 1
          fi

          docker build \
            --build-arg NEXT_PUBLIC_API_URL="$API_URL" \
            -t $IMAGE_NAME:${{ steps.vars.outputs.image_tag }} \
            -t $IMAGE_NAME:${{ github.sha }} \
            .

      - name: Stage 3.5 - Push frontend image
        run: |
          docker push $IMAGE_NAME:${{ steps.vars.outputs.image_tag }}
          docker push $IMAGE_NAME:${{ github.sha }}

  deploy:
    name: Stage 4 - Deploy environment
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref_name == 'stage' || github.ref_name == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Stage 4.1 - Checkout frontend manifests
        uses: actions/checkout@v4

      - name: Stage 4.2 - Install OpenShift CLI
        uses: redhat-actions/oc-installer@v1

      - name: Stage 4.3 - Login to OpenShift
        run: |
          oc login \
            --token=${{ secrets.OPENSHIFT_TOKEN }} \
            --server=${{ secrets.OPENSHIFT_SERVER }}

      - name: Stage 4.4 - Apply Kubernetes manifests
        run: |
          oc apply -f ${{ needs.build-and-push.outputs.manifest_file }} \
            -n ${{ secrets.OPENSHIFT_NAMESPACE }}

      - name: Stage 4.5 - Update frontend image
        run: |
          oc set image deployment/the-intelligent-investor-frontend-${{ needs.build-and-push.outputs.environment }} \
            the-intelligent-investor-frontend=${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }} \
            -n ${{ secrets.OPENSHIFT_NAMESPACE }}

      - name: Stage 4.6 - Wait for frontend rollout
        run: |
          oc rollout status deployment/the-intelligent-investor-frontend-${{ needs.build-and-push.outputs.environment }} \
            -n ${{ secrets.OPENSHIFT_NAMESPACE }} \
            --timeout=180s
