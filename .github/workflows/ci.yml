name: Frontend CI

env:
  AWS_REGION: eu-central-1
  FRONT_REPOSITORY: the-intelligent-investor/frontend

on:
  push:
    branches: [main, stage, dev]
  pull_request:
    branches: [main, stage, dev]

jobs:
