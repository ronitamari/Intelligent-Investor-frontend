name: Build and Push Frontend Image

on:
  push:
    branches: [ "main" ]

env:
  IMAGE_NAME: quay.io/roni-tamari/the-intelligent-investor-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest \
            .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:prep
          docker push $IMAGE_NAME:prod

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install oc
        uses: redhat-actions/oc-installer@v1

      - name: Login OpenShift
        run: |
          oc login \
            --token=${{ secrets.OPENSHIFT_TOKEN }} \
            --server=${{ secrets.OPENSHIFT_SERVER }}

      - name: Update image
        run: |
          oc set image deployment/the-intelligent-investor-frontend \
          the-intelligent-investor-frontend=quay.io/roni-tamari/the-intelligent-investor-frontend:prod