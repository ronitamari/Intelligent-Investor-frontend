apiVersion: apps/v1
kind: Deployment
metadata:
  name: the-intelligent-investor-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: the-intelligent-investor-frontend
  template:
    metadata:
      labels:
        app: the-intelligent-investor-frontend
    spec:
      containers:
        - name: the-intelligent-investor-frontend
          image: quay.io/roni-tamari/the-intelligent-investor-frontend:prep
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: the-intelligent-investor-frontend
spec:
  selector:
    app: the-intelligent-investor-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: the-intelligent-investor-frontend
spec:
  to:
    kind: Service
    name: the-intelligent-investor-frontend
  port:
    targetPort: http
  tls:
    termination: edge