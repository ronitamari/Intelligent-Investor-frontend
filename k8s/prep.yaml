apiVersion: apps/v1
kind: Deployment
metadata:
  name: the-intelligent-investor-frontend-prep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: the-intelligent-investor-frontend-prep
  template:
    metadata:
      labels:
        app: the-intelligent-investor-frontend-prep
    spec:
      containers:
        - name: the-intelligent-investor-frontend
          image: quay.io/roni-tamari/the-intelligent-investor-frontend:prep
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                secretKeyRef:
                  name: frontend-env-prep
                  key: NEXT_PUBLIC_API_URL
---
apiVersion: v1
kind: Service
metadata:
  name: the-intelligent-investor-frontend-prep
spec:
  selector:
    app: the-intelligent-investor-frontend-prep
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: the-intelligent-investor-frontend-prep
spec:
  to:
    kind: Service
    name: the-intelligent-investor-frontend-prep
  port:
    targetPort: http
  tls:
    termination: edge